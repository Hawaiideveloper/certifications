<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Infrastructure Certification Exam | NVIDIA • AWS • Azure • GCP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f1f3d 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }

        .exam-header {
            background: linear-gradient(90deg, #1a1a2e 0%, #2a2a4a 100%);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .exam-header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
        }

        .vendor-logos {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .vendor-logo {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .vendor-logo.nvidia { background: rgba(118, 185, 0, 0.2); color: #76b900; border: 1px solid rgba(118, 185, 0, 0.3); }
        .vendor-logo.aws { background: rgba(255, 153, 0, 0.2); color: #ff9900; border: 1px solid rgba(255, 153, 0, 0.3); }
        .vendor-logo.azure { background: rgba(0, 120, 212, 0.2); color: #0078d4; border: 1px solid rgba(0, 120, 212, 0.3); }
        .vendor-logo.gcp { background: rgba(66, 133, 244, 0.2); color: #4285f4; border: 1px solid rgba(66, 133, 244, 0.3); }

        .exam-info {
            display: flex;
            gap: 20px;
            color: #fff;
            font-size: 0.9rem;
        }

        .exam-info span {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .progress-bar {
            background: #1a1a2a;
            height: 4px;
            width: 100%;
        }

        .progress-fill {
            background: linear-gradient(90deg, #76b900, #00a4cc, #0078d4, #4285f4);
            height: 100%;
            transition: width 0.5s ease;
        }

        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .question-card {
            background: linear-gradient(145deg, #1e2a4a 0%, #1a2240 100%);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .question-number {
            color: #888;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .question-badges {
            display: flex;
            gap: 10px;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.nvidia { background: linear-gradient(135deg, rgba(118, 185, 0, 0.25), rgba(118, 185, 0, 0.1)); color: #76b900; border: 1px solid rgba(118, 185, 0, 0.3); }
        .badge.aws { background: linear-gradient(135deg, rgba(255, 153, 0, 0.25), rgba(255, 153, 0, 0.1)); color: #ff9900; border: 1px solid rgba(255, 153, 0, 0.3); }
        .badge.azure { background: linear-gradient(135deg, rgba(0, 120, 212, 0.25), rgba(0, 120, 212, 0.1)); color: #0078d4; border: 1px solid rgba(0, 120, 212, 0.3); }
        .badge.gcp { background: linear-gradient(135deg, rgba(66, 133, 244, 0.25), rgba(66, 133, 244, 0.1)); color: #4285f4; border: 1px solid rgba(66, 133, 244, 0.3); }

        .badge.domain {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.25), rgba(247, 147, 30, 0.1));
            color: #ff9966;
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #fff;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255,255,255,0.02);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 18px 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .option:hover {
            background: rgba(118, 185, 0, 0.08);
            border-color: rgba(118, 185, 0, 0.4);
            transform: translateX(4px);
        }

        .option.correct {
            background: rgba(0, 212, 170, 0.15);
            border-color: #00d4aa;
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.2);
        }

        .option.incorrect {
            background: rgba(255, 82, 82, 0.15);
            border-color: #ff5252;
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.2);
        }

        .option-letter {
            background: linear-gradient(135deg, #3a4a6b, #2a3a5b);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background: linear-gradient(135deg, #00d4aa, #00b894);
        }

        .option.incorrect .option-letter {
            background: linear-gradient(135deg, #ff5252, #d63031);
        }

        .option-text {
            flex: 1;
            line-height: 1.5;
            color: #c0c0c0;
            font-size: 0.95rem;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #76b900 0%, #5a9100 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(118, 185, 0, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 185, 0, 0.4);
        }

        .btn-primary:disabled {
            background: #3a4a5a;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: #888;
            border: 2px solid #444;
        }

        .btn-secondary:hover {
            border-color: #666;
            color: #aaa;
        }

        .explanation-box {
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            display: none;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation-box.correct {
            background: linear-gradient(145deg, rgba(0, 212, 170, 0.12), rgba(0, 184, 148, 0.06));
            border: 1px solid rgba(0, 212, 170, 0.25);
        }

        .explanation-box.incorrect {
            background: linear-gradient(145deg, rgba(255, 82, 82, 0.12), rgba(214, 48, 49, 0.06));
            border: 1px solid rgba(255, 82, 82, 0.25);
        }

        .explanation-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 600;
        }

        .explanation-box.correct .explanation-header { color: #00d4aa; }
        .explanation-box.incorrect .explanation-header { color: #ff5252; }

        .explanation-text {
            line-height: 1.7;
            color: #b0b0b0;
            font-size: 0.95rem;
        }

        .explanation-text strong { color: #76b900; }

        .evidence-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .evidence-title {
            color: #76b900;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .evidence-card {
            background: linear-gradient(145deg, rgba(118, 185, 0, 0.06), rgba(0, 164, 204, 0.03));
            border-left: 3px solid #76b900;
            border-radius: 0 8px 8px 0;
            padding: 18px;
            margin-bottom: 12px;
        }

        .evidence-quote {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #ddd;
            font-style: italic;
            margin-bottom: 12px;
            position: relative;
            padding-left: 18px;
        }

        .evidence-quote::before {
            content: '"';
            position: absolute;
            left: 0;
            top: -3px;
            font-size: 1.5rem;
            color: #76b900;
            font-family: Georgia, serif;
        }

        .evidence-highlight {
            background: linear-gradient(90deg, rgba(255, 235, 59, 0.35), rgba(255, 235, 59, 0.15));
            padding: 1px 5px;
            border-radius: 3px;
            color: #fff;
            font-weight: 600;
            font-style: normal;
        }

        .evidence-source {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #888;
        }

        .evidence-source-label { color: #76b900; font-weight: 600; }

        .evidence-link {
            color: #64b5f6;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(100, 181, 246, 0.12);
            border-radius: 4px;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }

        .evidence-link:hover {
            background: rgba(100, 181, 246, 0.25);
            color: #90caf9;
        }

        .evidence-location {
            color: #777;
            font-size: 0.75rem;
            margin-top: 6px;
            padding-left: 18px;
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
            padding: 50px 40px;
        }

        .start-screen h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #76b900, #ff9900, #0078d4, #4285f4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-screen .subtitle {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .vendor-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 40px 0;
        }

        .vendor-card {
            background: linear-gradient(145deg, #1e2a4a, #1a2240);
            border-radius: 12px;
            padding: 25px 15px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .vendor-card:hover {
            transform: translateY(-3px);
        }

        .vendor-card.nvidia { border-color: rgba(118, 185, 0, 0.3); }
        .vendor-card.nvidia:hover { border-color: #76b900; box-shadow: 0 5px 25px rgba(118, 185, 0, 0.2); }
        .vendor-card.aws { border-color: rgba(255, 153, 0, 0.3); }
        .vendor-card.aws:hover { border-color: #ff9900; box-shadow: 0 5px 25px rgba(255, 153, 0, 0.2); }
        .vendor-card.azure { border-color: rgba(0, 120, 212, 0.3); }
        .vendor-card.azure:hover { border-color: #0078d4; box-shadow: 0 5px 25px rgba(0, 120, 212, 0.2); }
        .vendor-card.gcp { border-color: rgba(66, 133, 244, 0.3); }
        .vendor-card.gcp:hover { border-color: #4285f4; box-shadow: 0 5px 25px rgba(66, 133, 244, 0.2); }

        .vendor-card.selected {
            transform: translateY(-3px);
        }
        .vendor-card.nvidia.selected { border-color: #76b900; background: rgba(118, 185, 0, 0.1); }
        .vendor-card.aws.selected { border-color: #ff9900; background: rgba(255, 153, 0, 0.1); }
        .vendor-card.azure.selected { border-color: #0078d4; background: rgba(0, 120, 212, 0.1); }
        .vendor-card.gcp.selected { border-color: #4285f4; background: rgba(66, 133, 244, 0.1); }

        .vendor-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .vendor-card.nvidia h3 { color: #76b900; }
        .vendor-card.aws h3 { color: #ff9900; }
        .vendor-card.azure h3 { color: #0078d4; }
        .vendor-card.gcp h3 { color: #4285f4; }

        .vendor-card p {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.5;
        }

        .vendor-card .q-count {
            margin-top: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .vendor-card.nvidia .q-count { color: #76b900; }
        .vendor-card.aws .q-count { color: #ff9900; }
        .vendor-card.azure .q-count { color: #0078d4; }
        .vendor-card.gcp .q-count { color: #4285f4; }

        .selection-hint {
            color: #666;
            font-size: 0.9rem;
            margin: 20px 0 30px;
        }

        .total-selected {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 25px;
        }

        .total-selected strong {
            color: #76b900;
            font-size: 1.3rem;
        }

        /* Score Screen */
        .score-container {
            text-align: center;
            padding: 50px;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1e2a4a, #2a3a5a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 4px solid;
        }

        .score-circle.pass { border-color: #00d4aa; }
        .score-circle.fail { border-color: #ff5252; }

        .score-number {
            font-size: 3rem;
            font-weight: 700;
        }

        .score-circle.pass .score-number { color: #00d4aa; }
        .score-circle.fail .score-number { color: #ff5252; }

        .score-label {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-message {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .score-details {
            color: #888;
            margin-bottom: 35px;
            line-height: 1.8;
        }

        .score-breakdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .breakdown-item {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 10px;
            min-width: 120px;
        }

        .breakdown-item .vendor { font-size: 0.8rem; margin-bottom: 5px; }
        .breakdown-item.nvidia .vendor { color: #76b900; }
        .breakdown-item.aws .vendor { color: #ff9900; }
        .breakdown-item.azure .vendor { color: #0078d4; }
        .breakdown-item.gcp .vendor { color: #4285f4; }

        .breakdown-item .score { font-size: 1.2rem; font-weight: 700; color: #fff; }

        @media (max-width: 768px) {
            .vendor-grid { grid-template-columns: repeat(2, 1fr); }
            .exam-header { flex-direction: column; gap: 15px; padding: 15px 20px; }
            .vendor-logos { display: none; }
            .question-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="exam-header">
        <h1>AI Infrastructure Certification Exam</h1>
        <div class="vendor-logos">
            <span class="vendor-logo nvidia">NVIDIA</span>
            <span class="vendor-logo aws">AWS</span>
            <span class="vendor-logo azure">AZURE</span>
            <span class="vendor-logo gcp">GCP</span>
        </div>
        <div class="exam-info">
            <span id="timer">Time: --:--</span>
            <span id="question-counter">Question: -- / --</span>
        </div>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div class="main-container">
        <div class="question-card" id="question-card">
            <!-- Content dynamically inserted -->
        </div>
    </div>

    <script>
        // ============================================
        // QUESTION BANK — 120 Questions
        // ============================================
        const allQuestions = [
            // ==================== NVIDIA (30 Questions) ====================
            {
                vendor: "nvidia",
                domain: "LLM Inference",
                question: "A data science team is deploying Llama 3.1 70B on an NVIDIA DGX H100 system using vLLM. Users report that the first token latency is 8 seconds, but subsequent token generation is fast (40ms per token). The team has verified the model is fully loaded into GPU memory. What is the MOST likely cause of the high first-token latency?",
                options: [
                    "The attention mechanism is computing the full KV-cache for the input prompt before generating the first output token",
                    "NVLink bandwidth is insufficient for the tensor parallelism configuration",
                    "The model weights are being transferred from CPU to GPU memory on the first request",
                    "CUDA kernel compilation (JIT) is occurring on the first inference request"
                ],
                correct: 0,
                explanation: "The high first-token latency (TTFT) with fast subsequent generation is characteristic of the <strong>prefill phase</strong>. During prefill, the model computes the KV-cache for all input tokens before generating output.",
                evidence: [
                    {
                        quote: "LLM inference consists of two phases: <span class='evidence-highlight'>prefill</span> and <span class='evidence-highlight'>decode</span>. During prefill, the model processes the input prompt and <span class='evidence-highlight'>computes the KV cache</span> for each transformer layer.",
                        source: "NVIDIA Developer Blog",
                        document: "Mastering LLM Techniques: Inference Optimization",
                        section: "Understanding LLM Inference Phases",
                        url: "https://developer.nvidia.com/blog/mastering-llm-techniques-inference-optimization/"
                    }
                ]
            },
            {
                vendor: "nvidia",
                domain: "CUDA Optimization",
                question: "You are optimizing a CUDA kernel that performs matrix multiplication on H100 GPUs. Profiling shows the kernel achieves only 35% of theoretical FLOPS. The occupancy is 100%, and memory bandwidth utilization is at 20%. What is the MOST likely optimization to improve performance?",
                options: [
                    "Increase the thread block size to improve parallelism",
                    "Use shared memory tiling to increase data reuse and reduce global memory accesses",
                    "Switch from FP32 to FP64 operations for better precision",
                    "Reduce the number of registers per thread to increase occupancy further"
                ],
                correct: 1,
                explanation: "Low memory bandwidth utilization (20%) with 100% occupancy indicates poor <strong>data reuse</strong>. <strong>Shared memory tiling</strong> loads data once and reuses it multiple times.",
                evidence: [
                    {
                        quote: "The key insight is that <span class='evidence-highlight'>elements of A and B are read multiple times</span> during matrix multiplication. By loading sub-matrices (tiles) into shared memory, we can <span class='evidence-highlight'>significantly reduce the number of accesses to global memory</span>.",
                        source: "NVIDIA Documentation",
                        document: "CUDA C++ Programming Guide",
                        section: "3.2.4. Shared Memory — Matrix Multiplication Example",
                        url: "https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html#shared-memory"
                    }
                ]
            },
            {
                vendor: "nvidia",
                domain: "Multi-GPU Systems",
                question: "You are configuring a DGX H100 system (8x H100 GPUs) for training. The system has 4th-gen NVLink providing 900 GB/s bidirectional bandwidth per GPU. When running NCCL AllReduce benchmarks, you observe only 450 GB/s effective bandwidth. What is the MOST likely cause?",
                options: [
                    "Half of the NVLink lanes have failed and need hardware replacement",
                    "The NCCL algorithm is using ring topology, which achieves ~50% of peak bidirectional bandwidth for AllReduce",
                    "GPU driver is throttling NVLink due to thermal limits",
                    "The benchmark is running with incompatible CUDA version"
                ],
                correct: 1,
                explanation: "The '900 GB/s bidirectional' means <strong>450 GB/s in each direction</strong>. Ring AllReduce uses unidirectional flow, so 450 GB/s is actually <strong>full utilization</strong>.",
                evidence: [
                    {
                        quote: "Each H100 GPU is connected via <span class='evidence-highlight'>NVLink 4.0 with 900 GB/s total bidirectional bandwidth</span>. This is 450 GB/s in each direction.",
                        source: "NVIDIA Documentation",
                        document: "DGX H100 User Guide",
                        section: "System Architecture — NVLink Topology",
                        url: "https://docs.nvidia.com/dgx/dgxh100-user-guide/index.html"
                    }
                ]
            },
            {
                vendor: "nvidia",
                domain: "Quantization",
                question: "You are optimizing a Llama 3.1 8B model for production inference on H100 GPUs using TensorRT-LLM. After applying FP8 quantization, you observe a 15% degradation in output quality (measured by perplexity) compared to FP16. What is the MOST effective technique to recover quality while maintaining FP8 performance benefits?",
                options: [
                    "Apply SmoothQuant preprocessing to redistribute quantization difficulty from activations to weights",
                    "Switch to INT8 quantization which has better hardware support on H100",
                    "Use mixed-precision with FP16 attention layers and FP8 for feed-forward layers only",
                    "Increase the calibration dataset size from 128 to 512 samples"
                ],
                correct: 0,
                explanation: "<strong>SmoothQuant</strong> mathematically migrates quantization difficulty from activations (which have outliers) to weights (more uniform distribution), recovering most quality loss.",
                evidence: [
                    {
                        quote: "SmoothQuant proposes to <span class='evidence-highlight'>smooth the activation outliers by migrating the quantization difficulty from activations to weights</span> with a mathematically equivalent transformation.",
                        source: "arXiv",
                        document: "SmoothQuant: Accurate and Efficient Post-Training Quantization for LLMs",
                        section: "Abstract",
                        url: "https://arxiv.org/abs/2211.10438"
                    }
                ]
            },
            {
                vendor: "nvidia",
                domain: "Inference Optimization",
                question: "You are serving a Mixtral 8x7B MoE (Mixture of Experts) model on 2x H100 GPUs using tensor parallelism. Users report inconsistent latencies — some requests complete in 200ms while similar-length requests take 2 seconds. What is the MOST likely cause?",
                options: [
                    "Load imbalance between GPUs due to uneven tensor parallel sharding",
                    "Different requests activate different expert combinations, causing variable compute load",
                    "The KV-cache is being evicted between requests due to memory pressure",
                    "PCIe bandwidth bottleneck when transferring activations between GPUs"
                ],
                correct: 1,
                explanation: "<strong>MoE models route each token to different experts</strong> based on learned routing. Different inputs activate different expert paths, causing highly variable compute loads.",
                evidence: [
                    {

            `).join('');

            document.getElementById('question-card').innerHTML = `
                <div class="question-header">
                    <div class="question-number">Question ${currentQuestion + 1} of ${currentQuestions.length}</div>
                    <div class="question-badges">
                        <span class="badge ${q.vendor}">${q.vendor.toUpperCase()}</span>
                        <span class="badge domain">${q.domain}</span>
                    </div>
                </div>
                <div class="question-text">${q.question}</div>
                <div class="options-container">
                    ${optionsHTML}
                </div>
                <div class="explanation-box" id="explanation-box">
                    <div class="explanation-header">
                        <span class="icon" id="explanation-icon"></span>
                        <span id="explanation-title"></span>
                    </div>
                    <div class="explanation-text" id="explanation-text"></div>
                </div>
                <div class="button-container">
                    <button class="btn btn-secondary" onclick="showStartScreen()">Exit Exam</button>
                    <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled>
                        ${currentQuestion === currentQuestions.length - 1 ? 'View Results' : 'Next Question'}
                    </button>
                </div>
            `;
        }

        function selectOption(idx) {
            if (answered) return;
            answered = true;

            const q = currentQuestions[currentQuestion];
            const isCorrect = idx === q.correct;

            vendorScores[q.vendor].total++;
            if (isCorrect) {
                score++;
                vendorScores[q.vendor].correct++;
            }

            document.querySelectorAll('.option').forEach((opt, i) => {
                if (i === q.correct) opt.classList.add('correct');
                else if (i === idx && !isCorrect) opt.classList.add('incorrect');
            });

            const explanationBox = document.getElementById('explanation-box');
            const explanationIcon = document.getElementById('explanation-icon');
            const explanationTitle = document.getElementById('explanation-title');
            const explanationText = document.getElementById('explanation-text');

            explanationBox.style.display = 'block';
            explanationBox.className = 'explanation-box ' + (isCorrect ? 'correct' : 'incorrect');

            explanationIcon.textContent = isCorrect ? '✓' : '✗';
            explanationTitle.textContent = isCorrect ? 'Correct!' : `Incorrect — The correct answer is ${String.fromCharCode(65 + q.correct)}`;

            let evidenceHTML = '';
            if (q.evidence && q.evidence.length > 0) {
                evidenceHTML = `
                    <div class="evidence-section">
                        <div class="evidence-title">
                            <span>📖</span> PROOF FROM OFFICIAL DOCUMENTATION
                        </div>
                        ${q.evidence.map(ev => `
                            <div class="evidence-card">
                                <div class="evidence-quote">${ev.quote}</div>
                                <div class="evidence-source">
                                    <span class="evidence-source-label">Source:</span>
                                    <span>${ev.source}</span>
                                    <a href="${ev.url}" target="_blank" rel="noopener noreferrer" class="evidence-link">📄 View Document</a>
                                </div>
                                <div class="evidence-location">📍 ${ev.document} → ${ev.section}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            explanationText.innerHTML = q.explanation + evidenceHTML;
            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= currentQuestions.length) {
                showResults();
            } else {
                showQuestion();
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            const percentage = Math.round((score / currentQuestions.length) * 100);
            const passed = percentage >= 70;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;

            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('question-counter').textContent = 'Exam Complete';

            let breakdownHTML = selectedVendors.map(v => {
                const vs = vendorScores[v];
                if (vs.total === 0) return '';
                const pct = Math.round((vs.correct / vs.total) * 100);
                return `<div class="breakdown-item ${v}">
                    <div class="vendor">${v.toUpperCase()}</div>
                    <div class="score">${vs.correct}/${vs.total} (${pct}%)</div>
                </div>`;
            }).join('');

            document.getElementById('question-card').innerHTML = `
                <div class="score-container">
                    <div class="score-circle ${passed ? 'pass' : 'fail'}">
                        <div class="score-number">${percentage}%</div>
                        <div class="score-label">Overall</div>
                    </div>
                    <div class="score-message" style="color: ${passed ? '#00d4aa' : '#ff5252'}">
                        ${passed ? 'Congratulations! You Passed!' : 'Keep Studying — You\'ve Got This!'}
                    </div>
                    <div class="score-details">
                        ${score} of ${currentQuestions.length} correct • ${minutes}m ${seconds}s • Pass: 70%
                    </div>
                    <div class="score-breakdown">${breakdownHTML}</div>
                    <button class="btn btn-primary" onclick="startExam()">Retake Exam</button>
                    <button class="btn btn-secondary" onclick="showStartScreen()" style="margin-left: 15px;">Change Vendors</button>
                </div>
            `;
        }

        function showStartScreen() {
            clearInterval(timerInterval);
            document.getElementById('timer').textContent = 'Time: --:--';
            document.getElementById('question-counter').textContent = 'Question: -- / --';
            document.getElementById('progress-fill').style.width = '0%';

            const counts = {
                nvidia: allQuestions.filter(q => q.vendor === 'nvidia').length,
                aws: allQuestions.filter(q => q.vendor === 'aws').length,
                azure: allQuestions.filter(q => q.vendor === 'azure').length,
                gcp: allQuestions.filter(q => q.vendor === 'gcp').length
            };

            const totalSelected = selectedVendors.reduce((sum, v) => sum + counts[v], 0);

            document.getElementById('question-card').innerHTML = `
                <div class="start-screen">
                    <h2>AI Infrastructure Certification Exam</h2>
                    <p class="subtitle">Master multi-cloud AI/ML for $500K+ roles</p>

                    <div class="selection-hint">Select vendors to include in your exam:</div>

                    <div class="vendor-grid">
                        <div class="vendor-card nvidia ${selectedVendors.includes('nvidia') ? 'selected' : ''}" onclick="toggleVendor('nvidia')">
                            <h3>NVIDIA</h3>
                            <p>CUDA, TensorRT, Triton,<br>Multi-GPU, DGX Systems</p>
                            <div class="q-count">${counts.nvidia} Questions</div>
                        </div>
                        <div class="vendor-card aws ${selectedVendors.includes('aws') ? 'selected' : ''}" onclick="toggleVendor('aws')">
                            <h3>AWS</h3>
                            <p>SageMaker, Bedrock, EFA,<br>Trainium, Inferentia</p>
                            <div class="q-count">${counts.aws} Questions</div>
                        </div>
                        <div class="vendor-card azure ${selectedVendors.includes('azure') ? 'selected' : ''}" onclick="toggleVendor('azure')">
                            <h3>Azure</h3>
                            <p>Azure ML, OpenAI Service,<br>ND VMs, InfiniBand</p>
                            <div class="q-count">${counts.azure} Questions</div>
                        </div>
                        <div class="vendor-card gcp ${selectedVendors.includes('gcp') ? 'selected' : ''}" onclick="toggleVendor('gcp')">
                            <h3>GCP</h3>
                            <p>Vertex AI, TPU, BigQuery ML,<br>Gemini API</p>
                            <div class="q-count">${counts.gcp} Questions</div>
                        </div>
                    </div>

                    <div class="total-selected">
                        <strong>${totalSelected}</strong> questions selected
                    </div>

                    <button class="btn btn-primary" onclick="startExam()" style="padding: 16px 45px; font-size: 1rem;">
                        Start Exam
                    </button>
                </div>
            `;
        }

        // Initialize
        showStartScreen();
    </script>
</body>
</html>
